name: Deploy SceneSignal draft preview to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scenesignal-public-draft-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'neophilism/SceneSignal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm run core:prepare
      - run: npm ci --ignore-scripts
      - name: Verify and build draft-only browser bundle
        run: npm run check
        env:
          SCENESIGNAL_STATIC_BASE_PATH: /SceneSignal/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: web-dist
  deploy:
    if: github.repository == 'neophilism/SceneSignal' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the tested draft-only artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
